const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='home',vi=false,phr=true,si=0,qi=0,ci=0,hideHint=false,selectedRange=[],marks={},undo=[],selected=D.s.map(()=>[]),banks=[],solved=new Set(),picks=Array(5).fill(null),checked=Array(5).fill(false),cardOrder=D.f.map((_,i)=>i),needs=new Set(),known=new Set(),filter=false,flipped=false;
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}if(b.length>1&&b.every((v,i)=>v===a[i]))b.push(b.shift());return b}function initBanks(){banks=D.s.map(s=>shuffle(s.c.map((_,i)=>i)))}initBanks();
function sentenceHTML(s,i,evidence=[]){let ranges=D.f.map((f,k)=>({f,k,start:s.t.indexOf(f[0])})).filter(o=>o.start>=0).sort((a,b)=>a.start-b.start);let h='';for(let j=0;j<s.t.length;j++){let r=ranges.find(r=>j>=r.start&&j<r.start+r.f[0].length);if(r&&j===r.start)h+=`<span class="phrase" data-card="${r.k}" title="View phrase">`;const key=i+':'+j;h+=`<span data-char="${key}" class="${marks[key]?'mark-'+marks[key]:''}">${esc(s.t[j])}</span>`;if(r&&j===r.start+r.f[0].length-1)h+='</span>'}return `<span data-sentence="${i}" class="${evidence.includes(i)?'ev':''}">${h}</span>`}
function reading(evidence=[]){return `<div class="tools" id="paint"><span class="muted">Select text:</span><button data-paint="y">Yellow</button><button data-paint="g">Green</button><button data-paint="p">Pink</button><button data-paint="">Erase</button><button data-undo>Undo</button><button data-clear>Clear colours</button></div><article class="reading ${phr?'showphrases':''}">`+[0,1,2].map(p=>`<p>${D.s.map((s,i)=>s.p===p?sentenceHTML(s,i,evidence):'').filter(Boolean).join(' ')}</p>${vi?`<div class="vi" lang="vi">${D.s.filter(s=>s.p===p).map(s=>s.v).join(' ')}</div>`:''}`).join('')+'</article>'}
function nums(n,current,attr,offset=1){return `<div class="nums">${Array.from({length:n},(_,i)=>`<button ${attr}="${i}" class="${i===current?'active':''}">${i+offset}</button>`).join('')}</div>`}
function home(){return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>Why cultural diversity matters</h2><span class="pill">3 paragraphs · 8 sentences · 5 questions</span></div>${reading()}</section>`}
function sentence(){const s=D.s[si],sel=selected[si];return `<section class="panel builder"><h3>SENTENCE BUILDER · Paragraph ${s.p+1}</h3><h2>Sentence ${si+1} / ${D.s.length}</h2><label>Go to sentence <select id="sentenceSelect">${D.s.map((_,i)=>`<option value="${i}" ${si===i?'selected':''}>${i+1}</option>`).join('')}</select></label><div class="hintvi"><div class="hinthead"><strong>VIETNAMESE HINT</strong><button id="hideHint">${hideHint?'Show':'Hide'}</button></div>${hideHint?'':`<p lang="vi">${s.v}</p>`}</div><div class="row listenrow"><button data-listen="${si}">▶ Listen to sentence</button><button id="sentenceStop">■ Stop</button></div><div class="chunks assembled">${sel.length?sel.map(i=>`<button data-return="${i}">${esc(s.c[i])}</button>`).join(''):'<span class="empty-prompt">Tap the chunks to build the original sentence.</span>'}</div><div class="chunks">${banks[si].filter(i=>!sel.includes(i)).map(i=>`<button data-chunk="${i}">${esc(s.c[i])}</button>`).join('')}</div><div class="row"><button class="primary" id="scheck">Check</button><button id="hint">Hint</button><button id="sclear">Clear</button><button id="sans">Show Answer</button></div><div id="sfeedback" role="status"></div><div class="row bottom"><button data-si="${Math.max(0,si-1)}" ${si===0?'disabled':''}>← Prev</button><span id="completed">${solved.size} / ${D.s.length} complete</span><button data-si="${Math.min(D.s.length-1,si+1)}" ${si===D.s.length-1?'disabled':''}>Next →</button></div></section>`}
function score(){return picks.reduce((n,p,i)=>n+(checked[i]&&p===D.q[i][3]?1:0),0)}
function drilling(){let q=D.q[qi],done=checked[qi];return `<div class="desk"><section class="panel"><h2>Reading desk</h2>${reading(done?q[4]:[])}</section><section class="panel"><span class="tag">Evidence quiz · Score ${score()} / 5</span>${nums(5,qi,'data-qi',32)}<h2 style="font:23px/1.45 Georgia">Question ${q[0]}. ${esc(q[1])}</h2>${q[2].map((o,i)=>`<button class="answer ${picks[qi]===i?'selected':''} ${done&&i===q[3]?'correct':''} ${done&&picks[qi]===i&&i!==q[3]?'wrong':''}" data-pick="${i}" ${done?'disabled':''}><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}<div class="row"><button class="primary" id="qcheck" ${picks[qi]===null?'disabled':''}>Check</button><button id="qretry">Try again</button></div>${done?`<div class="feedback" lang="vi"><b>${picks[qi]===q[3]?'Đúng':'Chưa đúng'} · Đáp án ${'ABCD'[q[3]]}</b><p>${q[5]}</p><p><b>${q[6]}</b></p><span class="tag">Evidence</span>${q[4].map(i=>`<p class="cardquote">“${esc(D.s[i].t)}”</p>`).join('')}</div>`:''}<div class="row" style="margin-top:18px"><button data-qi="${Math.max(0,qi-1)}" ${qi===0?'disabled':''}>Back</button><button data-qi="${Math.min(4,qi+1)}" ${qi===4?'disabled':''}>Next</button></div></section></div>`}
function currentCards(){return filter?cardOrder.filter(i=>needs.has(i)):cardOrder}
function cards(){let a=currentCards();ci=Math.min(ci,Math.max(0,a.length-1));let k=a[ci],f=D.f[k];return `<section class="panel card"><div class="row" style="justify-content:space-between"><h2>Review Cards</h2><span class="pill">${known.size} remembered · ${needs.size} to review</span></div><p class="muted">Recall the meaning, then reveal the original sentence.</p><div class="row"><button id="shuffle">Shuffle</button><button id="filter">${filter?'Show all cards':'Needs review only'}</button><button id="cardreset">Reset cards</button></div>${f?`<p class="tag" style="margin-top:30px">Useful phrase · ${ci+1} / ${a.length}</p><div class="term">${esc(f[0])}</div><div class="listenrow"><button data-listen="${f[2]}">▶ Listen to sentence</button></div><button class="primary" id="flip">${flipped?'Hide':'Show'} Answer</button>${flipped?`<div class="feedback"><h2 lang="vi">${f[1]}</h2><p class="cardquote">${esc(D.s[f[2]].t).replace(esc(f[0]),'<b>'+esc(f[0])+'</b>')}</p><p class="vi" lang="vi">${D.s[f[2]].v}</p><button data-link="${f[2]}">Practise this sentence</button></div>`:''}<div class="row" style="margin-top:20px"><button id="need">${needs.has(k)?'✓ ':''}Needs review</button><button id="know">${known.has(k)?'✓ ':''}Remembered</button></div><div class="row" style="margin-top:18px"><button id="cprev" ${ci===0?'disabled':''}>Previous</button><button id="cnext" ${ci===a.length-1?'disabled':''}>Next</button></div>`:'<p class="feedback">No cards marked for review yet.</p>'}</section>`}
function render(){selectedRange=[];$('#main').innerHTML=({home,sentence,drilling,cards}[mode])();document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#vi').textContent=vi?'VI ON':'VI OFF';$('#ph').textContent='Key phrases '+(phr?'ON':'OFF')}
function capture(){const sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed)return;const r=sel.getRangeAt(0);selectedRange=[...document.querySelectorAll('.reading [data-char]')].filter(e=>r.intersectsNode(e)).map(e=>e.dataset.char)}
document.addEventListener('mouseup',capture);document.addEventListener('touchend',capture);document.addEventListener('selectionchange',()=>{if(window.getSelection().toString())capture()});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#paint'))e.preventDefault()});
function applyMarks(){document.querySelectorAll('[data-char]').forEach(e=>{e.className=marks[e.dataset.char]?'mark-'+marks[e.dataset.char]:''})}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-card]');if(!b)return;let d=b.dataset;
if(d.mode){mode=d.mode;render()}else if(b.id==='vi'){vi=!vi;render()}else if(b.id==='ph'){phr=!phr;render()}else if(b.id==='reset'){marks={};undo=[];selected=D.s.map(()=>[]);solved.clear();picks.fill(null);checked.fill(false);known.clear();needs.clear();filter=false;flipped=false;ci=si=qi=0;initBanks();render()}
else if(d.paint!==undefined){if(selectedRange.length){undo.push({...marks});selectedRange.forEach(k=>d.paint?marks[k]=d.paint:delete marks[k]);applyMarks()}}
else if(d.undo!==undefined){if(undo.length){marks=undo.pop();applyMarks()}}else if(d.clear!==undefined){undo.push({...marks});marks={};applyMarks()}
else if(d.si!==undefined){si=+d.si;render()}else if(d.chunk!==undefined){selected[si].push(+d.chunk);render()}else if(d.return!==undefined){selected[si]=selected[si].filter(i=>i!==+d.return);render()}
else if(b.id==='hideHint'){hideHint=!hideHint;render()}else if(b.id==='sclear'){selected[si]=[];banks[si]=shuffle(banks[si]);render()}else if(b.id==='scheck'){let ok=selected[si].length===D.s[si].c.length&&selected[si].every((v,i)=>v===i);if(ok)solved.add(si);$('#completed').textContent=solved.size+' / '+D.s.length+' complete';$('#sfeedback').innerHTML=`<div class="feedback">${ok?'Correct — matches the original sentence.':'Not yet — the order does not match the original sentence.'}</div>`}
else if(b.id==='hint'){$('#sfeedback').innerHTML='<div class="feedback">Start with: <b>'+esc(D.s[si].c[0])+'</b></div>'}else if(b.id==='sans'){$('#sfeedback').innerHTML='<div class="feedback cardquote">'+esc(D.s[si].t)+'</div>'}
else if(d.qi!==undefined){qi=+d.qi;render()}else if(d.pick!==undefined){picks[qi]=+d.pick;render()}else if(b.id==='qcheck'){checked[qi]=true;render()}else if(b.id==='qretry'){checked[qi]=false;picks[qi]=null;render()}
else if(d.card!==undefined){if(window.getSelection().toString())return;let f=D.f[+d.card];$('#glossbody').innerHTML=`<h2>${esc(f[0])}</h2><p lang="vi">${f[1]}</p><button data-opencard="${d.card}">Open review card</button>`;$('#gloss').showModal()}
else if(d.opencard!==undefined){$('#gloss').close();mode='cards';filter=false;ci=cardOrder.indexOf(+d.opencard);flipped=false;render()}
else if(b.id==='flip'){flipped=!flipped;render()}else if(b.id==='shuffle'){cardOrder=shuffle(cardOrder);ci=0;flipped=false;render()}else if(b.id==='filter'){filter=!filter;ci=0;flipped=false;render()}else if(b.id==='cprev'||b.id==='cnext'){ci+=b.id==='cnext'?1:-1;flipped=false;render()}
else if(b.id==='need'||b.id==='know'){const k=currentCards()[ci];if(b.id==='need'){needs.add(k);known.delete(k)}else{known.add(k);needs.delete(k)}render()}
else if(b.id==='cardreset'){needs.clear();known.clear();filter=false;ci=0;flipped=false;render()}else if(d.link!==undefined){mode='sentence';si=+d.link;render()}
 });
const player=$('#audio');
const timeline=[[0,12.6],[12.6,24.5],[24.5,43.85],[43.85,54.8],[54.8,64.75],[64.75,76.05],[76.05,92.2],[92.2,105.12]];
let clipEnd=null,playToken=0,raf=null;
function stopAudio(){playToken++;player.pause();clipEnd=null;cancelAnimationFrame(raf);document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));}
function track(){cancelAnimationFrame(raf);if(clipEnd!==null&&player.currentTime>=clipEnd){const end=clipEnd;clipEnd=null;player.pause();player.currentTime=end;}const i=player.paused?-1:timeline.findIndex(t=>player.currentTime>=t[0]&&player.currentTime<t[1]);document.querySelectorAll('[data-sentence]').forEach(e=>e.classList.toggle('playing',+e.dataset.sentence===i));if(!player.paused)raf=requestAnimationFrame(track);}
async function listen(i){stopAudio();const token=playToken;try{if(player.readyState<1)await new Promise((resolve,reject)=>{player.addEventListener('loadedmetadata',resolve,{once:true});player.addEventListener('error',reject,{once:true});player.load()});if(token!==playToken)return;player.currentTime=timeline[i][0];clipEnd=timeline[i][1];await player.play();if(token!==playToken)player.pause();}catch(e){$('#audioStatus').textContent='Unable to play audio. Check that the MP3 is beside index.html.';}}
player.addEventListener('play',()=>{cancelAnimationFrame(raf);track()});player.addEventListener('pause',track);player.addEventListener('seeked',track);player.addEventListener('timeupdate',track);
$('#speed').onchange=e=>{player.playbackRate=+e.target.value};$('#astop').onclick=()=>{stopAudio();player.currentTime=0};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.listen!==undefined){listen(+b.dataset.listen);return;}if(b.id==='sentenceStop'){stopAudio();return;}if(b.dataset.mode!==undefined||b.dataset.si!==undefined||b.dataset.link!==undefined||b.dataset.opencard!==undefined||['reset','cprev','cnext','shuffle','filter','cardreset'].includes(b.id))stopAudio();});
document.addEventListener('change',e=>{if(e.target.id==='sentenceSelect'){stopAudio();si=+e.target.value;render();}});
render();
</script></body></html>
